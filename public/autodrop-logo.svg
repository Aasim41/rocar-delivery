<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Crimson Cyber Gradient -->
    <linearGradient id="crimson-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Electric Cyan Accent -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Orbital Sensor Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ff3366" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="14 20"/>

  <!-- Outer Hexagonal Armor Shield -->
  <polygon points="256,92 384,166 384,314 256,388 128,314 128,166" 
           fill="#0d1527" stroke="url(#cyan-grad)" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>

  <!-- Crimson Delivery Chassis -->
  <polygon points="256,128 356,186 356,298 256,356 156,298 156,186" 
           fill="url(#crimson-grad)" filter="url(#neon-glow)" opacity="0.95"/>

  <!-- Top Cargo Latch Hood (Geometric Facets) -->
  <polygon points="256,140 336,190 256,240 176,190" fill="#ffffff" fill-opacity="0.25"/>
  <polygon points="176,190 256,240 256,336 176,286" fill="#000000" fill-opacity="0.25"/>
  <polygon points="256,240 336,190 336,286 256,336" fill="#000000" fill-opacity="0.1"/>

  <!-- Central LiDAR Eye / Autonomous Core -->
  <circle cx="256" cy="240" r="26" fill="#050814" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="256" cy="240" r="14" fill="#38bdf8"/>
  <circle cx="251" cy="235" r="4" fill="#ffffff"/>

  <!-- Dynamic Speed Arrows / Forward Wings -->
  <path d="M216 414 L256 438 L296 414" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232 444 L256 458 L280 444" fill="none" stroke="#ff3366" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stealth Headlight Beams -->
  <line x1="200" y1="170" x2="160" y2="140" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="312" y1="170" x2="352" y2="140" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
</svg>
